# SPDX-License-Identifier: GPL-3.0-or-later
name: Platform core
on: [push, pull_request]
jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and emulation tools
        run: sudo apt-get update && sudo apt-get install -y clang lld ninja-build cmake python3 qemu-system-x86 ovmf grub-pc-bin grub-common xorriso mtools
      - name: Build, reproduce and boot
        env:
          SOURCE_DATE_EPOCH: '1704067200'
        run: python3 tests/phase0.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase0-evidence
          path: |
            build/phase0/*.log
            build/phase0/results.json
            build/phase0/i386-pc/*.elf
            build/phase0/x86_64-efi/*.efi
  gcc-compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC and emulation tools
        run: sudo apt-get update && sudo apt-get install -y gcc gcc-mingw-w64-x86-64 clang lld ninja-build cmake python3 qemu-system-x86 ovmf grub-pc-bin grub-common xorriso mtools
      - name: Build and boot with GCC
        run: python3 tests/gcc_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gcc-evidence
          path: build/gcc-smoke/*.log

  phase3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install platform test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld ninja-build cmake python3 python3-venv \
            qemu-system-x86 qemu-system-arm ovmf ovmf-ia32 qemu-efi-aarch64 \
            grub-pc-bin grub-common xorriso mtools gcc g++ pkg-config \
            libglib2.0-dev libpixman-1-dev libfdt-dev
      - name: Prepare pinned LoongArch emulator and firmware
        run: python3 tools/prepare_phase1.py
      - name: Build, reproduce and boot every entry
        env:
          SOURCE_DATE_EPOCH: '1704067200'
        run: python3 tests/phase3.py
      - name: Host memory and parser sanitizers
        run: |
          cmake -S . -B build/sanitizers -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug -DBOOT_SANITIZERS=ON
          cmake --build build/sanitizers
          ctest --test-dir build/sanitizers --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3-evidence
          path: |
            build/phase3/*.log
            build/phase3/results.json
            build/phase3/*/*.elf
            build/phase3/*/*.efi
            build/phase3/*/*.bz
            build/phase3/*/resource.cpio
            build/phase3/*/resource.manifest.sha256
